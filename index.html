<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✂️ Barbería - Sistema de Reservaciones</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ========== MENÚ DE NAVEGACIÓN ========== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-cut"></i> Barbería
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#agenda">
                            <i class="fas fa-calendar-week"></i> Agenda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#nueva-cita">
                            <i class="fas fa-plus-circle"></i> Nueva Cita
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <div class="container mt-4">
        
        <!-- ===== SECCIÓN: AGENDA SEMANAL ===== -->
        <section id="agenda">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="fas fa-calendar-week text-primary"></i> Agenda Semanal</h2>
                <div>
                    <button class="btn btn-outline-primary btn-sm" onclick="cargarAgenda()">
                        <i class="fas fa-sync-alt"></i> Actualizar
                    </button>
                </div>
            </div>
            <div id="agenda-container" class="row">
                <!-- Aquí se cargarán las citas automáticamente -->
                <div class="text-center text-muted">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Cargando agenda...</p>
                </div>
            </div>
        </section>

        <!-- ===== SECCIÓN: NUEVA CITA ===== -->
        <section id="nueva-cita" class="mt-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Nueva Cita</h4>
                </div>
                <div class="card-body">
                    <form id="form-cita">
                        <div class="row g-3">
                            <!-- Fecha -->
                            <div class="col-md-3">
                                <label for="fecha" class="form-label">
                                    <i class="fas fa-calendar-day"></i> Fecha
                                </label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            
                            <!-- Hora -->
                            <div class="col-md-3">
                                <label for="hora" class="form-label">
                                    <i class="fas fa-clock"></i> Hora
                                </label>
                                <input type="time" class="form-control" id="hora" required>
                            </div>
                            
                            <!-- Nombre -->
                            <div class="col-md-3">
                                <label for="nombre" class="form-label">
                                    <i class="fas fa-user"></i> Cliente
                                </label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                            </div>
                            
                            <!-- Teléfono -->
                            <div class="col-md-3">
                                <label for="telefono" class="form-label">
                                    <i class="fas fa-phone"></i> Teléfono
                                </label>
                                <input type="tel" class="form-control" id="telefono" placeholder="5512345678" required>
                            </div>
                            
                            <!-- Servicio -->
                            <div class="col-md-6">
                                <label for="servicio" class="form-label">
                                    <i class="fas fa-cut"></i> Servicio
                                </label>
                                <select class="form-select" id="servicio" required>
                                    <option value="">Seleccione un servicio...</option>
                                    <option value="Corte de cabello">✂️ Corte de cabello</option>
                                    <option value="Corte y barba">✂️ Corte y barba</option>
                                    <option value="Tinte">🎨 Tinte</option>
                                    <option value="Peinado">💇 Peinado</option>
                                    <option value="Arreglo de barba">🧔 Arreglo de barba</option>
                                    <option value="Corte infantil">👶 Corte infantil</option>
                                </select>
                            </div>
                            
                            <!-- Estado -->
                            <div class="col-md-6">
                                <label for="estado" class="form-label">
                                    <i class="fas fa-check-circle"></i> Estado
                                </label>
                                <select class="form-select" id="estado" required>
                                    <option value="Confirmada">✅ Confirmada</option>
                                    <option value="Completada">✔️ Completada</option>
                                    <option value="Cancelada">❌ Cancelada</option>
                                    <option value="No Asistió">⏳ No Asistió</option>
                                </select>
                            </div>
                            
                            <!-- Botón -->
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    <i class="fas fa-save"></i> Guardar Cita
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <!-- Mensajes de respuesta -->
                    <div id="mensaje" class="mt-3"></div>
                </div>
            </div>
        </section>

        <!-- ===== PIE DE PÁGINA ===== -->
        <footer class="text-center text-muted mt-5 py-3 border-top">
            <small>✂️ Sistema de Reservaciones - Barbería</small>
        </footer>
    </div>

    <!-- ========== MODAL PARA EDITAR CITA ========== -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Editar Cita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-editar">
                        <input type="hidden" id="edit-id">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="edit-fecha" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="edit-fecha" required>
                            </div>
                            <div class="col-md-6">
                                <label for="edit-hora" class="form-label">Hora</label>
                                <input type="time" class="form-control" id="edit-hora" required>
                            </div>
                            <div class="col-md-6">
                                <label for="edit-nombre" class="form-label">Cliente</label>
                                <input type="text" class="form-control" id="edit-nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label for="edit-telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="edit-telefono" required>
                            </div>
                            <div class="col-md-6">
                                <label for="edit-servicio" class="form-label">Servicio</label>
                                <select class="form-select" id="edit-servicio" required>
                                    <option value="Corte de cabello">Corte de cabello</option>
                                    <option value="Corte y barba">Corte y barba</option>
                                    <option value="Tinte">Tinte</option>
                                    <option value="Peinado">Peinado</option>
                                    <option value="Arreglo de barba">Arreglo de barba</option>
                                    <option value="Corte infantil">Corte infantil</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="edit-estado" class="form-label">Estado</label>
                                <select class="form-select" id="edit-estado" required>
                                    <option value="Confirmada">Confirmada</option>
                                    <option value="Completada">Completada</option>
                                    <option value="Cancelada">Cancelada</option>
                                    <option value="No Asistió">No Asistió</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" onclick="guardarEdicion()">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
